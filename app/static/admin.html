<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — The Path Finder</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">THERE IS <span>ANOTHER PATH</span></a><div class="muted">MVP Admin</div></nav><main class="section"><div class="card" id="login"><h2>Admin metrics</h2><p class="muted">Enter the ADMIN_TOKEN configured on the server.</p><input id="token" class="textarea" style="min-height:0" type="password" placeholder="Admin token"><br><br><button class="btn" onclick="loadMetrics()">Load metrics</button><p id="err" class="error"></p></div><div id="metrics" class="hidden"></div></main></div><script>
async function loadMetrics(){const t=document.querySelector('#token').value;const r=await fetch('/api/v1/admin/summary',{headers:{'X-Admin-Token':t}});if(!r.ok){document.querySelector('#err').textContent='Invalid token.';return}sessionStorage.setItem('pf-admin',t);render(await r.json())}function render(d){document.querySelector('#login').classList.add('hidden');document.querySelector('#metrics').classList.remove('hidden');document.querySelector('#metrics').innerHTML=`<div class="eyebrow">Live MVP metrics</div><h1>Path Finder</h1><div class="grid grid3"><div class="card"><div class="path-score">${d.paid}</div><div class="muted">Paid orders</div></div><div class="card"><div class="path-score">$${(d.revenue_cents/100).toFixed(2)}</div><div class="muted">Gross revenue</div></div><div class="card"><div class="path-score">${d.paid_to_assessment_rate}%</div><div class="muted">Paid → assessment</div></div></div><div class="card" style="margin-top:18px"><h3>Progress feedback</h3><p class="muted">Day 7: ${d.feedback['7']||0} · Day 14: ${d.feedback['14']||0} · Day 30: ${d.feedback['30']||0}</p></div>`}window.onload=()=>{const t=sessionStorage.getItem('pf-admin');if(t){document.querySelector('#token').value=t;loadMetrics()}}
</script></body></html>
