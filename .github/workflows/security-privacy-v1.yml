name: Security Privacy V1 CI

on:
  push:
    branches:
      - "security/privacy-v1"
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      DATABASE_URL: "sqlite:////tmp/pathfinder-security-ci.db"
      SESSION_COOKIE_SECURE: "false"
      ADMIN_TOKEN: "ci-admin-token"
      ASSESSMENT_RETENTION_DAYS: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check landing JavaScript syntax
        run: node --check app/static/app.js
      - name: Security smoke test
        shell: bash
        run: |
          export DATA_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from app import db
          from app.security import encrypt_json, decrypt_json, create_private_session, read_private_session

          encrypted = encrypt_json({"hello": "private"})
          assert encrypted.startswith("fernet:")
          assert decrypt_json(encrypted) == {"hello": "private"}

          cookie = create_private_session(42)
          assert read_private_session(cookie, 60) == 42

          db.init_db()
          purchase = db.create_purchase(1900, {"utm_source": "ci"}, status="paid")
          row = db.get_purchase_by_token(purchase["access_token"])
          assert row and row["status"] == "paid"
          assert row["access_token"].startswith("sha256:")

          db.save_assessment(purchase["id"], {"current_situation": "student"}, {"top_paths": []})
          saved = db.get_assessment_for_purchase(purchase["id"])
          assert saved["answers"]["current_situation"] == "student"

          from app.main import app
          with TestClient(app) as client:
              response = client.get("/start", params={"token": purchase["access_token"]}, follow_redirects=False)
              assert response.status_code == 303
              assert "pf_session=" in response.headers.get("set-cookie", "")
              client.cookies.update(response.cookies)

              access = client.get("/api/v1/access/me")
              assert access.status_code == 200
              assert access.json()["valid"] is True
              assert access.json()["completed"] is True
              assert access.json()["report_url"] == "/report"

              landing = client.get("/")
              assert landing.status_code == 200
              assert "app.js?v=returning-access-v1" in landing.text

              report = client.get("/api/v1/reports/me")
              assert report.status_code == 200

              delete = client.post("/api/v1/privacy/delete")
              assert delete.status_code == 200

          print("Security Privacy V1 smoke test passed")
          PY
